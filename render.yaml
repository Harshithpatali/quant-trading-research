services:
  - type: web
    name: quant-trading-research-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: APP_ENV
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_KEY
        sync: false

      - key: SUPABASE_TABLE
        value: sp500_daily

      - key: API_SECRET_KEY
        sync: false
