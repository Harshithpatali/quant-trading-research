name: Daily S&P 500 Update

on:
  # Run after the U.S. market has had time to finish the trading day.
  # 22:30 UTC is 6:30 PM ET during daylight-saving time and 5:30 PM ET
  # during standard time. The workflow itself verifies that a new
  # trading-day observation is actually available before updating data.
  schedule:
    - cron: "30 22 * * 1-5"

  # Allows a manual run from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-update:
    name: Update market data and verify prediction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify requirements file
        run: |
          echo "Repository requirements.txt:"
          cat requirements.txt
          echo "Checking yfinance requirement:"
          grep -n "yfinance" requirements.txt

          
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Verify production dependencies
        run: |
          python -m pip show yfinance
          python -c "import sys; print('Python:', sys.executable)"
          python -c "import yfinance; print('yfinance:', yfinance.__version__); assert yfinance.__version__ == '0.2.66'"
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__); assert sklearn.__version__ == '1.3.2'"

      - name: Run daily market-data update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          APP_ENV: production
          LOG_LEVEL: INFO
        run: |
          python scripts/daily_update.py

      - name: Verify production prediction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          APP_ENV: production
          LOG_LEVEL: INFO
        run: |
          python -c "from src.services.prediction_service import predict_current_market; r=predict_current_market(); print(r); assert r['status'] == 'success'; assert r['data']['validation_passed'] is True"

      - name: Upload workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
