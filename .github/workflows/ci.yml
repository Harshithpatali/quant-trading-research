name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test production application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify frozen ML runtime
        run: |
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__); assert sklearn.__version__ == '1.3.2'"

      - name: Compile application
        run: |
          python -m compileall src backend frontend

      - name: Import production modules
        env:
          APP_ENV: test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-key
          SUPABASE_TABLE: sp500_daily
          API_SECRET_KEY: test-secret
        run: |
          python -c "from src.data.validator import validate_ohlcv; from src.features.engineering import FEATURE_COLUMNS; from src.models.predictor import ModelPredictor; from src.strategy.signal import generate_signal; from src.services.prediction_service import PredictionService; from backend.schemas import PredictionResponse; print('Production imports: OK'); print('Feature count:', len(FEATURE_COLUMNS))"

      - name: Run tests if present
        env:
          APP_ENV: test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-key
          SUPABASE_TABLE: sp500_daily
          API_SECRET_KEY: test-secret
          LOG_LEVEL: INFO
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory found; compile/import checks completed."
          fi
